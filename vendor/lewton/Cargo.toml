# OpenRigCue's synchronous Ogg configuration of the cached Lewton 0.10.2 package.
# Original package manifest is preserved as Cargo.toml.orig.
[package]
autoexamples = false
name = "lewton"
version = "0.10.2"
edition = "2015"
authors = ["est31 <MTest31@outlook.com>"]
description = "Pure Rust vorbis decoder"
license = "MIT OR Apache-2.0"
repository = "https://github.com/RustAudio/lewton"
readme = "README.md"

[lib]
name = "lewton"

[dependencies]
byteorder = "1.0"
tinyvec = { version = "1.0", features = ["alloc"] }
ogg = { version = "0.8", path = "../ogg", optional = true }

[features]
default = ["ogg"]

[[example]]
name = "perf"
required-features = ["ogg"]

# Upstream 0.10.2 intentionally retains private cached fields and the
# historical optional cargo-c/async source. Keep that source unchanged.
[lints.rust]
dead_code = "allow"
mismatched_lifetime_syntaxes = "allow"
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(cargo_c)', 'cfg(feature, values("async_ogg"))'] }
