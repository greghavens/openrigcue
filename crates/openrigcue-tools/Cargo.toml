[package]
name = "openrigcue-tools"
description = "Native Linux motor setup, firmware maintenance and USB diagnostics"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
openrigcue-devices.workspace = true
openrigcue-model.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
clap.workspace = true
serialport.workspace = true
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
libc = "0.2"
libloading = "0.8.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies.openrigcue-config]
path = "../openrigcue-config"
[dependencies.openrigcue-desktop]
path = "../openrigcue-desktop"
[dependencies.ctrlc]
version = "3"
features = ["termination"]
