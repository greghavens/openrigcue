[package]
name = "openrigcue-ui"
description = "The openrigcue web UI: static pages embedded in the binary and the page descriptions they are built from"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
openrigcue-config = { path = "../openrigcue-config" }
openrigcue-sources = { path = "../openrigcue-sources" }
openrigcue-cueing.workspace = true
openrigcue-model.workspace = true
serde.workspace = true
toml.workspace = true
serde_json = "1"
flate2 = "1"
tracing.workspace = true
tokio = { version = "1", features = ["sync", "io-util"] }
hyper = "1"
httparse = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
httpdate = "1"
sha1 = "0.10"
base64 = "0.22"
indexmap = "2"
tower = { version = "0.5", features = ["util"] }
nix = { version = "0.29.0", features = ["signal"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "ws", "tokio", "http1"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
http-body-util = "0.1"

[lints]
workspace = true
