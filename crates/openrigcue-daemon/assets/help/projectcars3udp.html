<h3>Project CARS 3 telemetry</h3>
<ol>
<li>PC: open the main-menu System settings and select Project Cars 2 for Shared Memory.</li>
<li>Console: open Options → System from the main menu, set UDP Frequency to 1, and select the Project CARS 2 UDP protocol.</li>
</ol>
