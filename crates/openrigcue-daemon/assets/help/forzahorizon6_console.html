<h3>Forza Horizon 6 console</h3>
<ol>
<li>Open the game’s HUD / HUD and Gameplay settings and locate Telemetry or Data Out.</li>
<li>Turn Data Out on.</li>
<li>Set the Data Out destination address to ^ip^ and its UDP port to ^port^.</li>
<li>Save the settings and drive a car to start telemetry.</li>
</ol>
