<h3>FlyInside Flight Simulator</h3>
<ol>
<li>Install the telemetry startup script in the game’s Data/Scripts directory.</li>
<li>Keep the file name Startup_OpenRigCue.chai, then restart the simulator.</li>
</ol>
<p>The script is part of OpenRigCue: <a href="/res:game-plugins/Startup_OpenRigCue.chai" target="_blank" rel="noopener">save Startup_OpenRigCue.chai</a>.</p>
</article>
