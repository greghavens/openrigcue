<h3>Gran Turismo 7</h3>
<ol>
<li>Find the PlayStation’s IP address under Settings → Network → View Connection Status.</li>
<li>Enter that console address on OpenRigCue’s Games → Game page.</li>
<li>Start driving; the game sends telemetry while the car is moving.</li>
</ol>
