<h3>F1 2024 console</h3>
<ol>
<li>Open Game Options → Settings and find UDP Telemetry Settings.</li>
<li>Enable UDP Telemetry, disable Broadcast Mode, and select a 60 Hz send rate.</li>
<li>Set the destination address to ^ip^ and the UDP port to ^port^.</li>
<li>Choose 2024 as the UDP Format.</li>
</ol>

</article>
