<h3>Vector 36</h3>
<ol>
<li>Open Options → Advanced, enable XSim Telemetry, and accept the change.</li>
<li>The expected UDP port is ^port^. To change the game’s port, edit Vector36_Data/StreamingAssets/telemetry.cfg in the installation directory.</li>
<li>Restart the game after editing telemetry.cfg.</li>
</ol>

</article>
