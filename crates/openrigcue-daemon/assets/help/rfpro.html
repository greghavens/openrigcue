<h3>rFpro</h3>
<ol>
<li>Obtain the SimHub Hardware Plugin from rFpro support.</li>
<li>Extract the supplied plugin into your rFpro installation’s Plugins/Hardware directory.</li>
<li>In the rFpro administration console, open Physics and select SimHubPlugin as the hardware plugin.</li>
</ol>

</article>
