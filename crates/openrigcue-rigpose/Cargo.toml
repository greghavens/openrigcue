[package]
name = "openrigcue-rigpose"
description = "The OpenRigCue rig-pose shared-memory contract (seqlock file in /dev/shm) for VR motion compensation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "openrigcue-rigpose-sim"
path = "src/bin/openrigcue-rigpose-sim.rs"

[dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs", "time"] }
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3.20"

[lints]
workspace = true
