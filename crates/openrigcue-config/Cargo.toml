[package]
name = "openrigcue-config"
description = "Configuration, per-game tunes, profiles, game catalog and game detection"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
num-traits = "0.2.19"
openrigcue-model.workspace = true
serde.workspace = true
toml.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
ring = "0.17"
# Used by the detect unit (window titles through X11/XWayland); pure Rust, no system libraries.
x11rb = "0.13"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
